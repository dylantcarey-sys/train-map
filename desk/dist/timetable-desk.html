<title>Timetable Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a transcription desk. Context bar (source, railroad, table) on top, trains in the current table on the left, the entry sheet on the right. Times set like the Guide: a.m. light, p.m. bold. */
:root {
  --bg: #eef1ee;          /* desk */
  --sheet: #fbfcfa;       /* paper */
  --ink: #1b2420;
  --muted: #5d6a64;
  --rule: #cfd6d1;
  --rule-strong: #9aa7a0;
  --accent: #2f5d50;      /* Pullman green */
  --accent-ink: #ffffff;
  --accent-soft: #dde9e3;
  --warn: #9a5b00;
  --warn-soft: #fbefd9;
  --bad: #a4262c;
  --bad-soft: #f9e1e1;
  --focus: #2f7dd1;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121815; --sheet: #1a221e; --ink: #e3ebe6; --muted: #9aa9a1; --rule: #2e3a34; --rule-strong: #4a5a52;
  --accent: #7fbfa7; --accent-ink: #0e1512; --accent-soft: #23352d; --warn: #e8b361; --warn-soft: #3a2f1c;
  --bad: #f08a8f; --bad-soft: #3d2023; --focus: #6fb0ff; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121815; --sheet: #1a221e; --ink: #e3ebe6; --muted: #9aa9a1; --rule: #2e3a34; --rule-strong: #4a5a52;
  --accent: #7fbfa7; --accent-ink: #0e1512; --accent-soft: #23352d; --warn: #e8b361; --warn-soft: #3a2f1c;
  --bad: #f08a8f; --bad-soft: #3d2023; --focus: #6fb0ff; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--font-body); }
.wrap { padding-inline: 16px; padding-block: 12px 40px; max-width: 1600px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
h1, h2, h3, .label-cap { font-family: var(--font-display); letter-spacing: .02em; }
h1 { font-size: 26px; margin: 0; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
h2 { font-size: 19px; margin: 0; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; text-wrap: balance; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
button, input, select, textarea { font: inherit; color: inherit; }
button, a.btn { cursor: pointer; border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: 4px; padding: 5px 11px; }
a.btn { display: inline-block; color: inherit; text-decoration: none; line-height: normal; }
a.btn:hover { border-color: var(--accent); }
a.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.ghost { border-color: transparent; background: transparent; }
button.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
input, select, textarea { background: var(--sheet); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 5px 8px; min-width: 0; }
textarea { resize: vertical; }
label.f, div.f { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
label.f > span, div.f > span { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .06em; font-size: 12.5px; font-weight: 600; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.grow { flex: 1 1 160px; }

/* top */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.mainnav { display: flex; flex-wrap: wrap; gap: 2px; border: 1px solid var(--rule); border-radius: 6px; padding: 2px; background: var(--sheet); }
.mainnav button { border: 0; background: transparent; border-radius: 4px; padding: 5px 12px; font-weight: 500; }
.mainnav button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.mainnav button:not([aria-pressed="true"]):hover { background: var(--accent-soft); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
details.menu { position: relative; }
.sa-menu .menu-pop { left: 0; right: auto; min-width: 240px; }
.sa-menu > summary { padding: 5px 10px; }
.sheet-actions { align-items: center; }
details.menu > summary { list-style: none; cursor: pointer; border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: 4px; padding: 5px 11px; }
details.menu > summary::-webkit-details-marker { display: none; }
details.menu[open] > summary { border-color: var(--accent); }
.menu-pop { position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; background: var(--sheet); border: 1px solid var(--rule-strong); border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.12); padding: 4px; display: flex; flex-direction: column; min-width: 200px; }
.menu-pop button { border: 0; text-align: left; background: transparent; }
.menu-pop button:hover { background: var(--accent-soft); }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.save-state { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.save-state.err { color: var(--bad); }
.context { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 14px; align-items: end; }
.context .span2 { grid-column: span 2; }
@media (max-width: 520px) { .context .span2 { grid-column: auto; } }
tr.insec td.num { box-shadow: inset 4px 0 var(--secc); }
tr.sec0 { --secc: #4f7cac; } tr.sec1 { --secc: #c0793a; } tr.sec2 { --secc: #6a9a54; } tr.sec3 { --secc: #9a5a9a; }
.secchip { display: inline-block; padding: 0 6px; border-radius: 3px; border-left: 4px solid var(--secc); background: var(--sheet); }
.secchip.sec0 { --secc: #4f7cac; } .secchip.sec1 { --secc: #c0793a; } .secchip.sec2 { --secc: #6a9a54; } .secchip.sec3 { --secc: #9a5a9a; }
#stopTable td.seccol { width: 140px; min-width: 140px; } #stopTable td.seccol input { width: 132px; }
table.grid td.cellwrap input.insec { box-shadow: inset 3px 0 var(--secc); }
table.grid input.cell.sec0 { --secc: #4f7cac; } table.grid input.cell.sec1 { --secc: #c0793a; } table.grid input.cell.sec2 { --secc: #6a9a54; } table.grid input.cell.sec3 { --secc: #9a5a9a; }
.rrsw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: baseline; }
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 10px 36px 10px 14px; position: relative; }
.notice .notice-x { position: absolute; top: 6px; right: 6px; padding: 0 6px; font-size: 16px; line-height: 1.4; color: var(--warn); background: transparent; border: 0; opacity: .7; cursor: pointer; }
.notice .notice-x:hover, .notice .notice-x:focus-visible { opacity: 1; }

/* main */
.main { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 1000px) { .main { grid-template-columns: minmax(0, 1fr); } .main .trains { max-height: 280px; } }
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.trains { list-style: none; margin: 0; padding: 4px; max-height: 60vh; overflow: auto; }
.trains li button { width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 8px; border-radius: 4px; display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.trains li button .chip { margin-top: 0; }
.trains li button[aria-current="true"] .chip { color: var(--accent-ink); border-color: var(--accent-ink); background: transparent; }
.trains li button:hover { background: var(--accent-soft); }
.trains li button[aria-current="true"] { background: var(--accent); color: var(--accent-ink); }
.trains .no { font-family: var(--font-display); font-weight: 700; font-size: 17px; }
.trains .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
.pill { font-size: 11px; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .06em; padding: 1px 6px; border-radius: 10px; border: 1px solid currentColor; white-space: nowrap; }
.pill.ok { color: var(--accent); }
.trains li button[aria-current="true"] .pill { color: inherit; }
.empty { padding: 18px 14px; color: var(--muted); font-size: 14px; }

.tabs { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 5px; overflow: hidden; }
.tabs button { border: 0; border-radius: 0; padding: 6px 14px; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.tabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.body { padding: 12px 14px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 14px; }
.fields .wide { grid-column: 1 / -1; }
fieldset { border: 1px solid var(--rule); border-radius: 6px; padding: 8px 12px 12px; margin: 0; min-width: 0; }
legend { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; font-size: 13px; color: var(--muted); padding: 0 4px; }
details.more > summary { cursor: pointer; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; font-size: 13px; color: var(--muted); }

/* sheets */
.scroll { overflow-x: auto; border: 1px solid var(--rule); border-radius: 4px; }
table.sheet { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
table.sheet th { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .05em; font-size: 12.5px; font-weight: 600; color: var(--muted); text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--rule-strong); background: var(--sheet); white-space: nowrap; }
table.sheet td { border-bottom: 1px solid var(--rule); padding: 2px 3px; vertical-align: middle; }
table.sheet td input, table.sheet td select { width: 100%; border-color: transparent; background: transparent; padding: 5px 5px; }
table.sheet td input:hover, table.sheet td select:hover { border-color: var(--rule); }
table.sheet td input:focus, table.sheet td select:focus { border-color: var(--focus); background: var(--sheet); }
td.num { color: var(--muted); font-size: 12px; text-align: right; width: 28px; padding-right: 6px; }
input.time { font-family: var(--font-mono); width: 72px; text-align: center; font-size: 14px; }
input.time.pm, .cell.pm { font-weight: 600; }
input.bad, .cell.bad { background: var(--bad-soft) !important; color: var(--bad); }
.tz-auto { color: var(--muted); }
.need { background: var(--warn-soft) !important; }
.rowbtns { white-space: nowrap; text-align: right; }
.rowbtns button { padding: 2px 6px; font-size: 13px; }
.station-cell { min-width: 260px; width: 100%; }   /* the station name takes the spare width */
table.sheet td select[data-k="tz"] { width: 96px; }
table.sheet td select[data-k="days"] { width: 150px; }
.station-cell input.set { font-weight: 500; }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* grid view */
table.grid th.tr { text-align: center; min-width: 124px; padding: 3px 3px; }
table.grid th.tr input { width: 64px; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 14px; padding: 2px 4px; }
table.grid th.tr input.tname, table.grid th.tr select.tfreq { display: block; width: 116px; margin: 2px auto 0; font-family: var(--font-body, inherit); font-weight: 400; font-size: 11.5px; padding: 1px 3px; text-transform: none; letter-spacing: 0; color: var(--ink); text-align: center; }
table.grid th.tr input.tname { font-style: italic; }
table.grid th.tr .parts { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 4px; margin: 1px 0 2px; }
table.grid th.tr .partno { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 700; border: 1px solid var(--rule-strong); border-radius: 3px; background: color-mix(in srgb, var(--accent, #4f7cac) 10%, var(--sheet)); }
table.grid th.tr .partno button { padding: 0 3px; font-size: 11.5px; font-weight: 700; }
table.grid th.tr .partno .partx { font-weight: 400; opacity: .5; padding: 0 3px 0 1px; }
table.grid th.tr .addpart { font-size: 10.5px; padding: 0 4px; opacity: .6; }
table.grid input.cell[data-clash] { outline: 1px dashed var(--warn); }
table.grid td.partcell { background: color-mix(in srgb, var(--accent, #4f7cac) 7%, transparent); box-shadow: inset 2px 0 color-mix(in srgb, var(--accent, #4f7cac) 45%, transparent); }
table.grid th.tr select.trr { display: block; margin: 0 auto 2px; font-size: 11px; font-weight: 600; padding: 0 2px; width: 72px; text-align-last: center; }
table.grid th.tr select.tfreq { text-align-last: center; }
table.grid th.tr .tn { display: block; font-size: 11px; font-weight: 500; text-transform: none; letter-spacing: 0; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 2px auto 0; }
table.grid td.st { position: sticky; left: 0; background: var(--sheet); min-width: 200px; max-width: 270px; z-index: 1; font-size: 13px; }
table.grid th.stth { position: sticky; left: 0; z-index: 2; }
table.grid td.cellwrap { text-align: center; padding: 1px; }
table.grid td.cellwrap input { font-family: var(--font-mono); text-align: center; width: 118px; font-size: 12.5px; }
table.grid td.mls input { width: 50px; font-size: 12.5px; font-family: var(--font-mono); text-align: right; border-color: var(--rule); }
table.grid tr:hover td { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
table.grid tr:hover td.st { background: var(--accent-soft); }
.legend { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; }
.legend code { font-family: var(--font-mono); color: var(--ink); }

/* station picker */
.picker { position: fixed; z-index: 70; background: var(--sheet); border: 1px solid var(--rule-strong); border-radius: 6px; box-shadow: 0 8px 24px rgb(0 0 0 / .18); max-height: 320px; overflow: auto; min-width: 280px; max-width: min(460px, 92vw); padding: 4px; }
.picker button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 4px; }
.picker button[aria-selected="true"], .picker button:hover { background: var(--accent-soft); }
.picker .sid { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); margin-left: 6px; }
.picker .ptz { float: right; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }

/* dialog */
.overlay { position: fixed; inset: 0; background: rgb(0 0 0 / .35); z-index: 60; display: grid; place-items: center; padding: 16px; }
.dialog { background: var(--sheet); border-radius: 8px; width: min(560px, 100%); max-height: 90vh; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.err-text { color: var(--bad); font-size: 13px; }

/* status stepper */
.status-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.steps { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--rule-strong); border-radius: 6px; overflow: hidden; }
.step { border: 0; border-radius: 0; border-right: 1px solid var(--rule); padding: 6px 12px 6px 8px; display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; background: var(--sheet); }
.step:last-child { border-right: 0; }
.step .n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--rule-strong); font-size: 11.5px; font-family: var(--font-mono); }
.step.done { color: var(--accent); }
.step.done .n { background: var(--accent-soft); border-color: var(--accent); }
.step[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.step[aria-pressed="true"] .n { border-color: var(--accent-ink); }
.small-btn { font-size: 13px; padding: 4px 10px; }
.chip { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .06em; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 10px; margin-top: 3px; }
.chip.st-created { color: var(--muted); }
.chip.st-future { color: var(--muted); border-style: dashed; font-style: italic; }
.chip.st-adding { color: var(--warn); border-color: var(--warn); }
.chip.st-added { color: var(--focus); border-color: var(--focus); }
.chip.st-complete { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
/* through links */
.links { display: flex; flex-direction: column; gap: 6px; padding-block: 6px; }
.links-h { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.link-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.link-row select { width: 180px; }
.links > .small-btn { align-self: flex-start; }
/* grid extras */
.gridwrap { max-height: 72vh; overflow: auto; }   /* JS sets the exact height for 20 station rows */
table.grid tbody td { padding-top: 0; padding-bottom: 0; }
table.grid tbody td input { padding-top: 2px; padding-bottom: 2px; }
table.grid tbody td .stline button { padding-top: 0; padding-bottom: 0; }
table.grid thead th { position: sticky; top: var(--hdrTop, 0px); z-index: 3; }
#stopTable .rolebtn { font-size: 11.5px; padding: 1px 5px; color: var(--muted); border: 1px solid transparent; border-radius: 4px; }
.cell.disp { font-style: italic; text-decoration: underline dotted; }
#stopTable .rolebtn.on { color: var(--accent-ink); background: var(--accent); }
#stopTable tr.role-start td.num, #stopTable tr.role-end td.num { box-shadow: inset 3px 0 0 var(--accent); font-weight: 700; }
table.grid tbody td { border-bottom: 0; }
table.grid tr.addrow td { border-top: 1px solid var(--rule); }
table.grid tr.insrow td { background: var(--accent-soft); padding: 4px 6px; }
table.grid tr.insrow input { width: 100%; }
table.grid tr.divrow td { border-top: 1.5px solid var(--rule-strong); padding: 0; height: 4px; line-height: 0; position: relative; }
table.grid tr.divrow td.st { text-align: right; }
table.grid tr.divrow .divx { all: unset; cursor: pointer; font-size: 10px; line-height: 10px; padding: 0 3px; color: var(--muted); opacity: .25; position: relative; top: -6px; background: var(--sheet); border-radius: 2px; }
table.grid tr.divrow:hover .divx { opacity: .8; }
table.grid tr.divrow .divx:hover, table.grid tr.divrow .divx:focus-visible { opacity: 1; color: var(--danger, #b42318); }
table.grid .delcol { padding: 0 5px; font-size: 12px; opacity: .55; }
table.grid .delcol:hover, table.grid .delcol:focus { opacity: 1; }
table.grid .dirbtn { padding: 0 4px; font-size: 15px; color: var(--muted); min-width: 22px; }
table.grid .dirbtn.set { color: var(--accent); font-weight: 700; }
table.grid td.ord input { width: 40px; text-align: center; color: var(--muted); font-size: 12.5px; }
table.grid td.ord input.pending { color: var(--ink); font-weight: 700; border-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.stopwrap { max-height: 62vh; overflow: auto; }
#stopTable thead th { position: sticky; top: 0; z-index: 3; }
.warn-text { color: var(--warn); }
#statusMsg.flash { font-weight: 600; }
table.grid thead th.stth { z-index: 4; }
.colmove { display: flex; justify-content: space-between; min-height: 18px; }
.colmove button { padding: 0 6px; font-size: 14px; line-height: 1; }
table.grid th.tr .colmove input.colord { width: 34px; padding: 0 2px; font-size: 11px; font-weight: 500; height: 18px; text-align: center; color: var(--muted); }
.colmove input.colord.pending { color: var(--ink); font-weight: 700; border-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.stline { display: flex; gap: 2px; align-items: center; }
.stname { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stline button { padding: 1px 5px; font-size: 12.5px; }
tr.addrow input { width: 100%; }
td.notes-cell { min-width: 120px; width: 100%; }

/* fixed widths so nothing squeezes the time boxes */
table.sheet td.tcol { width: 112px; min-width: 112px; }
table.sheet td.tcol.one { width: 224px; min-width: 224px; }
.onetime { display: flex; gap: 4px; align-items: center; }
.onetime input.time { flex: 1; min-width: 0; }
.onetime .kindbtn, .onetime .bothbtn { padding: 2px 6px; font-size: 12px; min-width: 32px; }
table.sheet td input.time { width: 106px; padding-inline: 4px; }
table.sheet td.tzcol { width: 100px; min-width: 100px; }
td.notes-cell { width: auto; min-width: 140px; }

.match, .appnote { border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.alsoon { background: var(--accent-soft); border-radius: 6px; padding: 8px 12px; }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; font: inherit; cursor: pointer; text-align: left; }
.conflicts { margin-top: 6px; color: var(--warn); }
.conflicts ul { margin: 4px 0 0; padding-left: 18px; }

/* collapsible train list */

// through-service link lists
const linkKind = c => c?.kind === "conn" ? "conn" : "cars";
// a link that has its railroad, train and station is shown as text (click the train to open it); ✎ edits it again
const lkEditing = new Set(), lkKey = (id, dir, i) => `${id}|${dir}|${i}`;
const lkDone = c => !!(c && c.rr && (c.trainNo || c.phId) && c.stationId);
const lkTarget = c => (c.trainId && trainDoc(c.trainId)) || (c.phId && trainDoc(c.phId)) || (c.trainNo ? allTrainDocs().find(x => trRR(x) === c.rr && String(x.trainNo) === String(c.trainNo) && !x.setupOf) : null);

const lkTrainList = id => `<datalist id="lkTrains">${allTrainDocs().filter(t => t.id !== id && t.trainNo && !t.setupOf).sort((a, b) => trRR(a).localeCompare(trRR(b)) || Core.trainNoSort(a.trainNo, b.trainNo)).map(t => { const m = (t.stops || []).filter(x => x.stationId && !x.pass), a = m[0], z = m[m.length - 1]; return `<option value="${esc(trRR(t) + " " + t.trainNo)}">${esc([t.trainName, a && z && a !== z ? stName(a.stationId) + " – " + stName(z.stationId) : ""].filter(Boolean).join(" · "))}</option>`; }).join("")}</datalist>`;
// "PC 4205" (or just "4205" when only one railroad has it) -> that train
const lkParseTrain = (v, rr, id) => { v = String(v || "").trim(); const all = allTrainDocs().filter(t => t.id !== id && t.trainNo && !t.setupOf);
  const full = all.find(t => `${trRR(t)} ${t.trainNo}`.toLowerCase() === v.toLowerCase()); if (full) return full;
  const same = all.filter(t => String(t.trainNo) === v); return same.find(t => trRR(t) === rr) || (same.length === 1 ? same[0] : null); };
// put the matching link on the other train (connects to <-> connects from), if it isn't there yet
function lkMirror(id, dir, c) {
  const me = trainDoc(id), o = lkTarget(c); if (!me || !o || o.id === id || !c.stationId) return "";
  c.trainId = o.id;
  const back = dir === "to" ? "from" : "to", list = linkList(edit(o.id), back);
  const isMe = x => x.trainId === id || x.phId === id || (me.trainNo && x.rr === trRR(me) && String(x.trainNo) === String(me.trainNo));
  const hit = list.find(x => isMe(x) && (!x.stationId || x.stationId === c.stationId));
  if (hit) { if (!hit.stationId) hit.stationId = c.stationId; if (!hit.trainId && me.trainNo) hit.trainId = id; return ""; }
  list.push({ rr: trRR(me), ...(me.trainNo ? { trainNo: me.trainNo, trainId: id } : { phId: id }), stationId: c.stationId, ...(linkKind(c) === "conn" ? { kind: "conn" } : {}), ...(c.days ? { days: c.days } : {}) });
  return o.trainNo ? `${trRR(o)} ${o.trainNo}` : trLabel(o);
}
const lkFinish = (id, dir, i) => { const c = linkList(edit(id), dir)[i]; if (!lkDone(c)) return false; lkEditing.delete(lkKey(id, dir, i)); const who = lkMirror(id, dir, c); if (who) notice(`Also added on ${esc(who)}, so the link shows on both trains.`); return true; };

  $("dRowsNone").onclick = () => { document.querySelectorAll("#dRowsList [data-rowpick]").forEach(c => c.checked = false); count(); };
  draw();
}

    <p class="small muted" style="margin:0">Moving rows only changes this grid; each train keeps its own stop order (see One train). The ↓/↑ beside a train number shows whether it reads down or up the table, which decides where a new time you type here goes in its stops. Columns stay in the order you add them; use ‹ › to rearrange. A train already entered on another table can be added with <b>Add existing train</b> on the left.</p>`;
  const g = $("grid");
  wireMatch(el);
  $("chkOrd").onchange = e => { LS.set("gridOrderCol", e.target.checked); renderEntry(); };

  $("btnAddExGrid").onclick = addExistingDialog;
  if ($("chkColNums")) $("chkColNums").onchange = e => { LS.set("gridColNums", e.target.checked); renderEntry(); };
  // typed column numbers wait for "Apply"; each typed train goes to its number, the rest keep their order around them
  const colUi = () => { const n = S.colPending.size; const a = $("btnApplyCol"), b = $("btnResetCol"), h = $("colHint"); if (a) a.disabled = !n; if (b) b.disabled = !n; if (h) h.textContent = n ? `${n} column${n > 1 ? "s" : ""} to move` : "Type new column numbers above the train numbers, then apply them together."; };
  const applyCols = () => {

    }

  $("btnResetOrd") && ($("btnResetOrd").onclick = () => { S.ordPending.clear(); renderEntry(); });
  $("btnAddNums").onclick = () => addSeveralDialog();

    <label class="f"><span>How many train columns?</span><input id="dNCols" type="number" min="1" max="60" value="5" inputmode="numeric" style="width:90px"></label>
    <p class="small muted">Adds that many empty columns at the right, ready for their numbers. To type the numbers up front instead, use <b>Add several</b> in the Trains list.</p>`, "Add columns", () => {

    edit(id); renderEntry(); renderTrainList(); setTimeout(() => $("grid")?.querySelector(`th input[data-k="no"][data-train="${id}"]`)?.focus(), 0);
  };
  const insRow = $("insRow");

    insRow.addEventListener("input", () => openPicker(insRow, s => {
      mutateTable(tb => { const k = tb.rows.findIndex(x => x.rid === S.insAt); tb.rows.splice(k < 0 ? tb.rows.length : k, 0, { rid: uid(), stationId: s.id }); });

      Object.assign(st, p.pass ? { pass: true, arr: "", dep: "", single: false, mark: "" } : { pass: false, arr: p.arr, dep: p.dep, single: p.single, mark: p.mark });

    if (e.key === "Enter" || e.key === "ArrowDown" || e.key === "ArrowUp") {

// ---------- dialogs ----------
function dialog(html, okLabel, onOk, onCancel) {
  const ov = $("overlay");
  ov.innerHTML = `<div class="dialog" role="dialog" aria-modal="true">${html}<div class="err-text" id="dErr"></div><div class="actions"><button id="dCancel">Cancel</button><button id="dOk" class="primary">${esc(okLabel)}</button></div></div>`;
  ov.hidden = false;
  const close = () => { ov.hidden = true; ov.innerHTML = ""; };
  $("dCancel").onclick = () => { close(); onCancel?.(); };
  $("dOk").onclick = async () => { const r = await onOk(); if (typeof r === "string") { $("dErr").textContent = r; return; } close(); };
  ov.onkeydown = e => { if (e.key === "Escape") { close(); onCancel?.(); } };
  setTimeout(() => ov.querySelector("input, select, textarea")?.focus(), 0);
}
function confirmInline(btn, label, fn) {
  if (btn.dataset.armed) { fn(); return; }
  const old = btn.textContent; btn.dataset.armed = "1"; btn.textContent = label;
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = old; } }, 3000);
}

 target=\"_blank\" rel=\"noopener\">Amtrak<\/a>, <a href=\"https://rrgtfsfeeds.s3.amazonaws.com/gtfsmnr.zip\" target=\"_blank\" rel=\"noopener\">Metro-North<\/a>, <a href=\"https://rrgtfsfeeds.s3.amazonaws.com/gtfslirr.zip\" target=\"_blank\" rel=\"noopener\">LIRR<\/a>. Its rail trains for one typical week (the next whole week the feed covers, unless you pick one) are added as their own source in the list above. Stations within 400 m of one of your historic stations use that station; the rest are added from the feed.<\/div>\n      <\/div>\n    <\/details>\n\n    <div id=\"status\"><\/div>\n  <\/aside>\n\n  <div id=\"mapWrap\">\n    <div id=\"viewDiv\"><\/div>\n    <div id=\"loading\">Loading lines and stations\u2026<\/div>\n    <div id=\"noSdk\"><div style=\"max-width:420px\"><h2 style=\"font-size:17px\">The ArcGIS map library didn't load<\/h2>\n      <p id=\"noSdkWhy\"><\/p><p class=\"hint\">The chat preview blocks outside websites, so download this file and open it in Chrome, Edge, Firefox or Safari.<\/p><\/div><\/div>\n    <div id=\"info\"><button class=\"x\" id=\"infoClose\" aria-label=\"Close\">\u00d7<\/button><div id=\"infoBody\"><\/div>\n      <label class=\"chk\" style=\"margin-top:6px\"><input type=\"checkbox\" id=\"follow\"> Follow this train<\/label><\/div>\n    <div id=\"bar\">\n      <button id=\"play\" style=\"min-width:76px\">\u25b6 Play<\/button>\n      <span id=\"clock\">--:--<\/span>\n      <input type=\"range\" id=\"slider\" min=\"0\" max=\"1440\" step=\"0.25\" value=\"480\" aria-label=\"Time of day\">\n      <select id=\"speed\" title=\"Playback speed\" aria-label=\"Playback speed\">\n        <option value=\"60\">1 min/s<\/option><option value=\"300\" selected>5 min/s<\/option><option value=\"900\">15 min/s<\/option><option value=\"1800\">30 min/s<\/option><option value=\"3600\">1 hr/s<\/option>\n      <\/select>\n      <span id=\"count\"><\/span>\n      <button id=\"locBtn\" title=\"Zoom to my location\" aria-label=\"Zoom to my location\">\ud83d\udccd<\/button>\n      <button id=\"panelBtn\" title=\"Hide or show the side panel\">\u25c2 Panel<\/button>\n      <button id=\"fsBtn\" title=\"Full screen\">\u26f6 Full screen<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\n// ===== Train map: pure helpers (no DOM, no ArcGIS) =====\nconst MapCore = (() => {\n  const R = 6378137;\n  const toMerc = ([lon, lat]) => { const la = Math.max(Math.min(lat, 85.05112878), -85.05112878); return [R * lon * Math.PI / 180, R * Math.log(Math.tan(Math.PI / 4 + la * Math.PI / 360))]; };\n  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);\n  const TZ_OFF = { AT: -60, ET: 0, CT: 60, MT: 120, PT: 180 };   // minutes to add to local time to get Eastern\n  const toMin = s => { const m = String(s || \"\").match(/^(\\d{1,2}):(\\d{2})$/); return m ? +m[1] * 60 + +m[2] : null; };\n  const DAYS = [\"Sunday\", \"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\", \"Saturday\"];\n\n  function parseCSV(text) {\n    text = String(text || \"\").replace(/^\ufeff/, \"\");\n    const rows = []; let row = [], f = \"\", q = false;\n    for (let i = 0; i < text.length; i++) {\n      const c = text[i];\n      if (q) { if (c === '\"') { if (text[i + 1] === '\"') { f += '\"'; i++; } else q = false; } else f += c; }\n      else if (c === '\"') q = true;\n      else if (c === \",\") { row.push(f); f = \"\"; }\n      else if (c === \"\\n\" || c === \"\\r\") { if (c === \"\\r\" && text[i + 1] === \"\\n\") i++; row.push(f); f = \"\"; if (row.some(v => v !== \"\")) rows.push(row); row = []; }\n      else f += c;\n    }\n    row.push(f); if (row.some(v => v !== \"\")) rows.push(row);\n    const head = (rows.shift() || []).map(h => h.trim());\n    return rows.map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? \"\").trim()])));\n  }\n\n  // \"Daily except Saturday and Sunday\" -> Set of weekday numbers (0 = Sunday); null = every day / unknown\n  function parseDays(text) {\n    const s = String(text || \"\").toLowerCase();\n    if (!s || /^daily$/.test(s.trim())) return null;\n    const named = d => DAYS.map((n, i) => [n.toLowerCase(), i]).filter(([n]) => new RegExp(\"\\\\b\" + n + \"s?\\\\b\").test(d)).map(([, i]) => i);\n    // \"Monday through Friday\", \"Mon. thru Sat.\": every day in the range\n    const rg = s.match(/\\b(sun|mon|tue|wed|thu|fri|sat)[a-z]*\\.?\\s*(?:through|thru|to|-|\u2013)\\s*(sun|mon|tue|wed|thu|fri|sat)[a-z]*/);\n    if (rg && !/except/.test(s)) { const ab = [\"sun\", \"mon\", \"tue\", \"wed\", \"thu\", \"fri\", \"sat\"], a = ab.indexOf(rg[1]), b = ab.indexOf(rg[2]); const out = new Set(); for (let i = a; ; i = (i + 1) % 7) { out.add(i); if (i === b) break; } named(s).forEach(i => out.add(i)); return out.size === 7 ? null : out; }\n    if (/except/.test(s)) { const [, ex] = s.split(/except/); const out = new Set([0, 1, 2, 3, 4, 5, 6]); named(ex).forEach(i => out.delete(i)); return out; }\n    if (/only/.test(s) || named(s).length) { const n = named(s); return n.length ? new Set(n) : null; }\n    if (/weekdays?/.test(s)) return new Set([1, 2, 3, 4, 5]);\n    return null;\n  }\n\n  // Timetable Desk export rows -> trains with absolute Eastern minutes\n  function tripsFromExport(rows) {\n    const by = new Map();\n    for (const r of rows) {\n      if (!r.train_id || !r.station_id) continue;\n      const k = (r.source || \"\") + \"|\" + r.train_id;\n      if (!by.has(k)) by.set(k, { key: k, id: r.train_id, section: r.section || \"\", base: r.section ? String(r.train_id).replace(/\\s*\\([^)]*\\)\\s*$/, \"\") : r.train_id, color: /^#[0-9a-f]{6}$/i.test(r.rr_color || \"\") ? r.rr_color : \"\", lineNames: String(r.lines || \"\").split(/[;\\n]+/).map(x => x.trim()).filter(Boolean), source: r.source || \"\", sourceDate: r.source_date || \"\", rr: r.rr || \"\", rrName: r.railroad || \"\", no: r.train_no || \"\", name: r.train_name || \"\", alsoCalled: r.also_called || \"\", freq: r.frequency || \"\", consist: r.consist || \"\", notes: r.train_notes || \"\", tables: new Set(), status: r.status || \"\", from: r.continues_from || \"\", to: r.continues_as || \"\", stops: [] });\n      const t = by.get(k); (r.tables || \"\").split(/;\\s*/).filter(Boolean).forEach(x => t.tables.add(x));\n      t.stops.push({ seq: +r.stop_sequence || t.stops.length + 1, sid: r.station_id, name: r.station || r.station_id, town: r.city || \"\", state: r.state || \"\", arr: r.arrival || \"\", dep: r.departure || \"\", tz: r.tz || \"ET\", mark: r.mark || \"\", markMeaning: r.mark_meaning || \"\", notes: r.stop_notes || \"\", shared: r.stop_section === \"shared\", sdays: r.stop_days || \"\" });\n    }\n    const out = [];\n    for (const t of by.values()) {\n      t.stops.sort((a, b) => a.seq - b.seq);\n      t.stops = t.stops.filter(s => toMin(s.arr) != null || toMin(s.dep) != null);\n      if (t.stops.length < 2) continue;\n      // stations entered top-to-bottom for a train that reads upward: times run backwards, so flip\n      const seq = t.stops.flatMap(s => [s.arr, s.dep].filter(x => toMin(x) != null).map(x => toMin(x) + (TZ_OFF[s.tz] ?? 0)));\n      let up = 0, down = 0; for (let i = 1; i < seq.length; i++) { if (seq[i] > seq[i - 1]) up++; else if (seq[i] < seq[i - 1]) down++; }\n      t.reversed = down > up;\n      if (t.reversed) t.stops.reverse();\n      unroll(t);\n      t.days = parseDays(t.freq);\n      for (const s of t.stops) s.daySet = s.sdays ? parseDays(s.sdays) : null;   // days this stop is made (its own calendar day)\n      t.tables = [...t.tables];\n      out.push(t);\n    }\n    return out;\n  }\n  // absolute Eastern minutes from midnight of the day the train leaves its first station\n  function unroll(t) {\n    let prev = null, add = 0;\n    const step = (hhmm, tz) => { const m = toMin(hhmm); if (m == null) return null; let et = m + (TZ_OFF[tz] ?? 0) + add; if (prev != null && et < prev - 5) { add += 1440; et += 1440; } prev = et; return et; };\n    for (const s of t.stops) { s.arrAbs = step(s.arr, s.tz); s.depAbs = step(s.dep, s.tz); if (s.arrAbs == null) s.arrAbs = s.depAbs; if (s.depAbs == null) s.depAbs = s.arrAbs; }\n    // a minute's stop at every regular station given one time, so trains visibly pause (not at \"on signal\" / \"on notice\" stops)\n    const flag = s => /on signal|on notice|notice to (the )?(agent|conductor)/i.test(s.markMeaning || \"\");\n    for (let i = 1; i < t.stops.length - 1; i++) {\n      const s = t.stops[i], p = t.stops[i - 1];\n      if (s.arrAbs != null && s.depAbs != null && s.depAbs - s.arrAbs < 1 && !flag(s)) s.arrAbs = Math.max(s.depAbs - 1, p.depAbs + (s.depAbs - p.depAbs) / 2);\n    }\n    const base = Math.floor(t.stops[0].depAbs / 1440) * 1440;   // e.g. first time in Central time before midnight Eastern\n    for (const s of t.stops) { s.arrAbs -= base; s.depAbs -= base; }\n    t.start = t.stops[0].depAbs; t.end = t.stops[t.stops.length - 1].arrAbs;\n  }\n\n  // ---------- served-by matching ----------\n  const STOP = /\\b(the|railroad|railway|railways|rail|road|company|corporation|corp|transportation|co|inc|lines?|system)\\b/g;\n  const normRR = s => String(s || \"\").toLowerCase().replace(/&/g, \" and \").replace(/[^a-z ]/g, \" \").replace(STOP, \" \").replace(/\\band\\b/g, \" \").replace(/\\s+/g, \" \").trim();\n  function servedBy(served, rrName, rrAbbrev) {\n    if (!served) return false;\n    const want = normRR(rrName); if (!want && !rrAbbrev) return false;\n    const ab = String(rrAbbrev || \"\").toLowerCase().replace(/[^a-z0-9]/g, \"\");\n    const inside = (short, long) => short.split(\" \").length >= 2 && (\" \" + long + \" \").includes(\" \" + short + \" \");\n    return String(served).split(/[;,/]/).some(part => {\n      const p = normRR(part); if (!p) return false;\n      if (ab && part.toLowerCase().replace(/[^a-z0-9]/g, \"\") === ab) return true;\n      return want && (p === want || inside(p, want) || inside(want, p));\n    });\n  }\n  // nearest \"S1970Nov\"-style field to a date; fields: [{name, alias}]\n  const MON = [\"jan\", \"feb\", \"mar\", \"apr\", \"may\", \"jun\", \"jul\", \"aug\", \"sep\", \"oct\", \"nov\", \"dec\"];\n  function fieldDate(f) {\n    const s = f.name + \" \" + (f.alias || \"\");\n    let m = s.match(/S(\\d{4})([A-Za-z]{3})/); if (m && MON.includes(m[2].toLowerCase())) return +m[1] * 12 + MON.indexOf(m[2].toLowerCase());\n    m = (f.alias || \"\").match(/(\\d{4})\\s*-\\s*([A-Za-z]{3})/); if (m && MON.includes(m[2].toLowerCase())) return +m[1] * 12 + MON.indexOf(m[2].toLowerCase());\n    m = f.name.match(/Served_([A-Za-z]{3})(\\d{2})/); if (m && MON.includes(m[1].toLowerCase())) return (1900 + +m[2]) * 12 + MON.indexOf(m[1].toLowerCase());\n    // month name then year, e.g. \"Served by - April 1971\" or Served_by_April_1971\n    m = s.match(/\\b([A-Za-z]{3})[a-z]*[\\s_\\-]*(\\d{4})\\b/); if (m && MON.includes(m[1].toLowerCase())) return +m[2] * 12 + MON.indexOf(m[1].toLowerCase());\n    m = s.match(/_([A-Za-z]{3})[a-z]*_*(\\d{4})/); if (m && MON.includes(m[1].toLowerCase())) return +m[2] * 12 + MON.indexOf(m[1].toLowerCase());\n    return null;\n  }\n  function servedField(fields, iso) {\n    const m = String(iso || \"\").match(/^(\\d{4})-(\\d{2})/); if (!m) return null;\n    const want = +m[1] * 12 + +m[2] - 1;\n    let best = null; for (const f of fields) { const d = fieldDate(f); if (d == null) continue; const gap = Math.abs(d - want) + (d > want ? 0.5 : 0); if (!best || gap < best.gap) best = { name: f.name, alias: f.alias, gap }; }\n    return best;\n  }\n\n  // ---------- rail network ----------\n  // lines: [{paths: [[[lon,lat],...]], attrs}] ; each edge remembers its line\n  function buildNetwork(lines, opts = {}) {\n    const step = opts.densify ?? 400, join = opts.join ?? 600, cell = 2000;\n    const nodes = [], adj = [], key = new Map();\n    const nodeOf = p => { const k = Math.round(p[0]) + \",\" + Math.round(p[1]); if (key.has(k)) return key.get(k); const id = nodes.length; nodes.push(p); adj.push([]); key.set(k, id); return id; };\n    const segs = [];\n    const link = (a, b, li) => { if (a === b) return; const d = dist(nodes[a], nodes[b]); adj[a].push([b, d, li]); adj[b].push([a, d, li]); if (li >= 0) segs.push([a, b, li]); };\n    const ends = [];\n    lines.forEach((ln, li) => {\n      for (const path of ln.paths) {\n        const m = path.map(toMerc); if (m.length < 2) continue;\n        let prev = nodeOf(m[0]); ends.push([prev, li]);\n        for (let i = 1; i < m.length; i++) {\n          const a = m[i - 1], b = m[i], n = Math.max(1, Math.ceil(dist(a, b) / step));\n          for (let j = 1; j <= n; j++) { const cur = nodeOf([a[0] + (b[0] - a[0]) * j / n, a[1] + (b[1] - a[1]) * j / n]); link(prev, cur, li); prev = cur; }\n        }\n        ends.push([prev, li]);\n      }\n    });\n    // where two different lines cross (or one runs into the middle of another) without sharing a point, add a junction\n    { const sg = new Map(), done = new Set(); let added = 0;\n      segs.forEach((sgm, k) => { const a = nodes[sgm[0]], b = nodes[sgm[1]];\n        for (let x = Math.floor(Math.min(a[0], b[0]) / cell); x <= Math.floor(Math.max(a[0], b[0]) / cell); x++)\n          for (let y = Math.floor(Math.min(a[1], b[1]) / cell); y <= Math.floor(Math.max(a[1], b[1]) / cell); y++) { const kk = x + \":\" + y; if (!sg.has(kk)) sg.set(kk, []); sg.get(kk).push(k); } });\n      for (const list of sg.values()) for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {\n        const s1 = segs[list[i]], s2 = segs[list[j]]; if (s1[2] === s2[2]) continue;\n        if (s1[0] === s2[0] || s1[0] === s2[1] || s1[1] === s2[0] || s1[1] === s2[1]) continue;\n        const pk = list[i] < list[j] ? list[i] + \",\" + list[j] : list[j] + \",\" + list[i]; if (done.has(pk)) continue; done.add(pk);\n        const p = nodes[s1[0]], r = [nodes[s1[1]][0] - p[0], nodes[s1[1]][1] - p[1]], q = nodes[s2[0]], v = [nodes[s2[1]][0] - q[0], nodes[s2[1]][1] - q[1]];\n        const den = r[0] * v[1] - r[1] * v[0]; if (Math.abs(den) < 1e-9) continu     for (const d of tq.docs) { const t = d.data(); if ((t.rows || []).some(r => r.stationId === oldId)) { t.rows.forEach(r => { if (r.stationId === oldId) r.stationId = newId; }); await S.db.doc(`sources/${src.id}/tables/${d.id}`).set(t); changed++; } }

// put an existing train on one more table, ready for its stops
function attachDialog(id) {
  const tr = trainDoc(id); if (!tr) return;
  const have = new Set(Object.keys(tr.tables || {})), rr = trRR(tr);
  const opts = S.tables.filter(t => !have.has(t.id)).sort((a, b) => (a.rr === rr ? 0 : 1) - (b.rr === rr ? 0 : 1));

    <label class="f"><span>Table</span><select id="dAtT">${opts.map(t => `<option value="${esc(t.id)}">${esc(tableName(t))}${t.page ? " · p. " + esc(t.page) : ""}</option>`).join("")}</select></label>`, "Add", () => {
    const T = $("dAtT").value; if (!T) return "Choose a table.";
    const w = edit(id); w.tables = { ...(w.tables || {}), [T]: { order: Date.now(), status: "created" } };
    S.tableId = T; LS.set("table", T); renderTrainsPage();
  });
}

// ---------- train helpers: every train in this source, dashed pairs, splitting a pair ----------
const allTrainDocs = () => [...new Set([...S.trains.keys(), ...S.work.keys()])].map(trainDoc).filter(x => x && !x._deleted);
const onTables = t => Object.keys(t.tables || {}).filter(k => tableById(k));
const PAIR = /^\s*(\d+[A-Za-z]?)\s*[-–]\s*(\d+[A-Za-z]?)\s*$/;
function makeRosterTrain(rr, no) { const id = uid(); remember(`${trainsPath()}/${id}`, null); S.work.set(id, { id, rr, trainNo: no, trainName: "", frequency: "Daily", createdAt: new Date().toISOString(), tables: {}, stops: [] }); edit(id); return id; }
// a dashed pair (5-3) split into its two trains, changing over at the chosen station (the one it arrives at as the first number and leaves as the second)
// split points along a train: between two stops (e.g. the Ar. and Lv. rows of a station printed twice), or within one stop that has both times

  const tagged = (tr.stops || []).map((s, k) => ({ ...s, _k: k }));

async function startSource() {
  const byDate = [...S.sources].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  for (const s of byDate) {
    try { const c = S.db.collection(`sources/${s.id}/tables`); const q = await (c.limit ? c.limit(1) : c).get(); if (q.docs.length) return s.id; } catch (e) { console.warn(e); }
  }
  return byDate[0]?.id || "";
}
async function start() {
  render();
  const [db, dl] = await Promise.all([window.claude?.use?.("db") ?? null, window.claude?.use?.("downloads") ?? null]);
  S.db = db; S.dl = dl;
  $("btnExport").disabled = $("btnBackup").disabled = !dl;
  if (!db) { notice("Saving isn't available in this view. Open this page on claude.ai while signed in."); await loadStations(); return; }
  let picking = false;
  db.collection("sources").onSnapshot(async snap => {
    S.sources = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    // nothing remembered on this device (or it's gone): open the newest source that has tables, not just the newest source

    renderContext();

  db.collection("railroads").onSnapshot(snap => {

// a table as printed: stations down the side, one column per train, times as text
// columns for the read-only table view: trains that run on from one another on this table share a column.
// Automatic: a through-car link or a connection where one train ends at the station where the other starts (on this table).
// A train's tables[T].col can be "own" (always its own column) or another train's id (always in that train's column).
function tableColumns(T, trs) {
  const ids = new Set(trs.map(x => x.id)), up = new Map(trs.map(x => [x.id, x.id]));
  const find = x => { while (up.get(x) !== x) { up.set(x, up.get(up.get(x))); x = up.get(x); } return x; };
  const join = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) up.set(rb, ra); };
  const colOf = x => x.tables?.[T]?.col || "";
  const ends = x => { const st = (x.stops || []).filter(s => s.tableId === T && s.stationId && !s.pass); return st.length ? [st[0].stationId, st[st.length - 1].stationId] : null; };
  const byNo = new Map(trs.filter(x => x.trainNo).map(x => [`${trRR(x)}|${x.trainNo}`, x]));
  for (const x of trs) {
    const c = colOf(x); if (c && c !== "own" && ids.has(c)) { join(c, x.id); continue; }
    if (c === "own") continue;
    const ex = ends(x); if (!ex) continue;
    for (const l of links(x, "to")) {
      const o = (l.trainId && ids.has(l.trainId) && trs.find(y => y.id === l.trainId)) || (l.phId && trs.find(y => y.id === l.phId)) || byNo.get(`${l.rr}|${l.trainNo}`);
      if (!o || o.id === x.id || colOf(o)) continue;
      const eo = ends(o); if (!eo) continue;
      if (ex[1] === eo[0] && (!l.stationId || l.stationId === ex[1])) join(x.id, o.id);
    }
  }
  const groups = new Map(); for (const x of trs) { const r = find(x.id); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(x); }
  return [...groups.values()];
}
function renderTableView(el, t) {

  const allTrs = trainsInTable();
  const cols = tableColumns(t.id, allTrs);
  const rows = (t.rows || []).slice();
  for (const tr of allTrs) if (!rowsDeferred(tr)) for (const s of tStops(tr)) if (s.stationId && !rows.some(r => r.rid === s.rid)) rows.push({ rid: s.rid || "", stationId: s.stationId });
  const cellFor = (tr, r) => tStops(tr).find(s => s.rid && s.rid === r.rid) || (!r.rid ? tStops(tr).find(s => s.stationId === r.stationId) : null);
  if (!allTrs.length) { el.innerHTML = `<div class="empty">No trains on this table yet.</div>`; return; }
  const used = new Set();
  const cell = (col, r) => {
    const hits = col.map(tr => cellFor(tr, r)).filter(Boolean);
    if (!hits.length) return `<td></td>`;
    hits.forEach(s => { if (s.mark) used.add(s.mark); });
    const pm = hits.some(s => !s.pass && Core.isPM(s.dep || s.arr));
    return `<td class="tv-t ${pm ? "pm" : ""}">${hits.map(s => esc(Core.formatCell12(s))).join(" / ")}</td>`;
  };
  // the column heading: the train name(s) once, then each train's number (with its railroad when it isn't this table's)
  const noOf = tr => tr.placeholder && !tr.trainNo ? `Unnumbered ${trRR(tr)} train${tr.description ? ": " + tr.description : ""}` : `${trRR(tr) !== t.rr ? trRR(tr) + " " : ""}No. ${tr.trainNo || "?"}`;
  const head = col => {
    const names = [...new Set(col.map(x => x.trainName).filter(Boolean))], fqs = new Set(col.map(x => x.frequency || "Daily"));
    // one frequency for the whole column when they all match; otherwise name the train it belongs to
    const fq = fqs.size === 1 ? [...fqs].filter(f => f !== "Daily") : col.filter(x => (x.frequency || "Daily") !== "Daily").map(x => `${noOf(x)}: ${x.frequency}`);
    return `<th>${names.length ? `<div class="tv-nm">${esc(names.join(" / "))}</div>` : ""}${col.map(tr => `<button class="tv-no" data-trview="${esc(tr.id)}" title="Open on the Trains page">${esc(noOf(tr))}</button>`).join(`<span class="tv-sep">·</span>`)}${fq.map(f => `<span class="tv-fq">${esc(f)}</span>`).join("")}</th>`;
  };
  el.innerHTML = `<div class="tv-wrap"><table class="tv">
    <thead><tr><th class="tv-st">Station</th>${cols.map(head).join("")}</tr></thead>
    <tbody>${rows.map(r => r.divider ? `<tr class="tv-div"><td colspan="${cols.length + 1}"></td></tr>` : `<tr><td class="tv-st">${esc(S.stById.get(r.stationId)?.name || r.stationId)}<span class="muted"> ${esc(S.stById.get(r.stationId)?.state || "")}</span></td>${cols.map(col => cell(col, r)).join("")}</tr>`).join("")}</tbody>
  </table></div>
  ${marksLine(t, [...used])}
  ${t.notes ? `<p class="small muted" style="margin:0;white-space:pre-line">${esc(t.notes)}</p>` : ""}
  <p class="small muted" style="margin:0">Times are as printed (${esc(t.tz || "ET")}, ${esc(t.basis || "time basis not stated")}). <b>Bold</b> times are p.m.</p>`;
  el.querySelectorAll("[data-trview]").forEach(b => b.onclick = () => openTrainRecord(b.dataset.trview, t.id));
}
applyPhoneMode();
start();
})();
</script>
