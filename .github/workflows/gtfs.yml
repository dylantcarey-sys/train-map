name: Update modern timetables (GTFS)
on:
  schedule:
    - cron: "17 9 1 * *"   # the 1st of each month, about 5:17 am Eastern
  workflow_dispatch:        # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Bring back last week's feeds (kept if a download fails)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gtfs-data
          path: gtfs
      - name: Build Shore Line East (an unofficial feed made from CTrail's PDF timetables)
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --break-system-packages pdfplumber pytesseract pillow
          git clone --depth 1 https://github.com/ethanc8/sle-gtfs /tmp/sle
          cd /tmp/sle && python3 -m gtfs_builder.build_gtfs --out-dir build/gtfs --zip build/sle-gtfs.zip
      - name: Save the Rail Runner schedule pages (its GTFS file is out of date)
        continue-on-error: true
        run: |
          mkdir -p gtfs/pages
          for p in 226/Weekday 340/Ride-the-Train 261/GTFS-Data; do curl -sSL -A "Mozilla/5.0" "https://www.riometro.org/$p" -o "gtfs/pages/riometro-$(echo $p | tr / -).html" || true; done
      - run: python3 scripts/fetch_gtfs.py
      - name: Combine all railroads into this week's "Modern trains" timetable
        run: |
          npm install --no-save --silent jszip@3
          node scripts/build_today.js
      - name: Publish to the gtfs-data branch (replaced each time so the repo stays small)
        run: |
          rm -rf gtfs/.git
          cd gtfs
          git init -q -b gtfs-data
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -q -m "GTFS feeds $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gtfs-data
