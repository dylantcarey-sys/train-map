name: Update modern timetables (GTFS)
on:
  schedule:
    - cron: "17 9 * * 1"   # every Monday, about 5:17 am Eastern
  workflow_dispatch:        # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_gtfs.py
      - name: Save any changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add gtfs
          git diff --cached --quiet || (git commit -m "Update GTFS feeds" && git push)
