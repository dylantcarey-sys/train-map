name: Update modern timetables (GTFS)
on:
  schedule:
    - cron: "17 9 * * 1"   # every Monday, about 5:17 am Eastern
  workflow_dispatch:        # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Bring back last week's feeds (kept if a download fails)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gtfs-data
          path: gtfs
      - run: python3 scripts/fetch_gtfs.py
      - name: Publish to the gtfs-data branch (replaced each week so the repo stays small)
        run: |
          rm -rf gtfs/.git
          cd gtfs
          git init -q -b gtfs-data
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -q -m "GTFS feeds $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gtfs-data
